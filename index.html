<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>芋、焼きます</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f3e3cf;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif;color:#4a2c1d;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
.hidden{display:none!important}
#steps{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(255,250,242,.75);color:#9b7a63;box-shadow:0 1px 4px rgba(90,50,20,.12);white-space:nowrap}
.chip.on{background:#c2410c;color:#fff}
.chip.done{background:#f6c38a;color:#6b3a14}
#instr{position:fixed;top:48px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(120,50,10,.45),0 0 14px rgba(120,50,10,.35);text-align:center;pointer-events:none;width:92%}
#sub{position:fixed;top:78px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:#7a4a2a;background:rgba(255,250,242,.8);padding:3px 12px;border-radius:99px;pointer-events:none;white-space:nowrap}
#gauge{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);width:min(82vw,420px);height:26px;border-radius:99px;background:rgba(255,250,242,.9);box-shadow:0 3px 12px rgba(90,50,20,.2),inset 0 2px 4px rgba(0,0,0,.1);overflow:hidden;pointer-events:none}
#gfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#fbbf24,#ea580c);border-radius:99px}
#gzone{position:absolute;top:0;bottom:0;background:rgba(34,197,94,.35);border-left:2px solid #16a34a;border-right:2px solid #16a34a}
#gmark{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#4a2c1d;border-radius:3px;box-shadow:0 0 0 2px #fff}
#glabel{position:fixed;left:50%;bottom:142px;transform:translateX(-50%);display:flex;justify-content:space-between;width:min(82vw,420px);font-size:12px;font-weight:700;color:#7a4a2a;pointer-events:none}
#act{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);border:none;border-radius:20px;padding:16px 40px;font:inherit;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#f97316,#c2410c);box-shadow:0 6px 0 #8a2c06,0 10px 24px rgba(140,50,10,.35);cursor:pointer}
#act:active{transform:translate(-50%,4px);box-shadow:0 2px 0 #8a2c06}
#timer{position:fixed;top:12px;right:14px;font-size:22px;font-weight:900;color:#fff;background:rgba(194,65,12,.9);border-radius:14px;padding:4px 12px;pointer-events:none;min-width:56px;text-align:center}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(60,25,8,.25),rgba(60,25,8,.55))}
.card{background:#fffaf2;border-radius:26px;padding:26px 24px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(60,25,8,.45);border:3px solid #f6d7b0;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.card .step{font-size:12px;font-weight:900;letter-spacing:.2em;color:#ea580c}
.card h1{font-size:34px;margin:4px 0 6px;font-weight:900;color:#7c2d12;line-height:1.15}
.card h2{font-size:30px;margin:2px 0 8px;font-weight:900;color:#7c2d12}
.card p{font-size:14px;line-height:1.75;margin:8px 0;color:#6b4430}
.btn{margin-top:12px;border:none;border-radius:18px;padding:13px 34px;font:inherit;font-size:19px;font-weight:900;color:#fff;background:linear-gradient(#f97316,#c2410c);box-shadow:0 5px 0 #8a2c06;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a2c06}
.btn.sub{background:#f3e3cf;color:#7c2d12;box-shadow:0 5px 0 #d9bf9f;font-size:15px;padding:10px 20px}
#fb{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#fbT{font-size:48px;font-weight:900;color:#fff;-webkit-text-stroke:2px #9a3412;text-shadow:0 5px 0 #9a3412,0 10px 30px rgba(120,40,0,.4);animation:pop .4s cubic-bezier(.2,1.8,.4,1)}
#fbS{font-size:22px;font-weight:900;color:#7c2d12;background:#fffaf2;border-radius:99px;padding:4px 18px;display:inline-block;margin-top:8px;box-shadow:0 4px 12px rgba(90,40,10,.25)}
#fbC{margin:10px auto 0;max-width:86vw;width:max-content;font-size:16px;font-weight:900;color:#fff;background:rgba(124,45,18,.88);border-radius:14px;padding:8px 16px;box-shadow:0 4px 14px rgba(60,20,0,.3)}
.chip.fail{background:#7c2d12;color:#fecaca}
#rcom{font-size:14px;font-weight:700;color:#9a3412;margin:-4px 0 8px}
#res .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 4px;border-bottom:1px dashed #ecd3b4}
#res .row b{color:#c2410c}
#total{font-size:52px;font-weight:900;color:#c2410c;line-height:1;margin:6px 0 0}
#rank{font-size:20px;font-weight:900;color:#7c2d12;margin:6px 0 10px}
.stars{font-size:26px;letter-spacing:4px;color:#f59e0b}
@media(max-width:640px){.chip .lbl{display:none}.chip.on .lbl{display:inline}#instr{font-size:16px}}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:#f3e3cf}
#resCard{max-height:92vh;overflow:auto}
#dragHint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;color:#7a4a2a;background:rgba(255,250,242,.8);padding:4px 12px;border-radius:99px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="steps" class="hidden"></div>
<div id="instr"></div>
<div id="sub" class="hidden"></div>
<div id="timer" class="hidden"></div>
<div id="glabel" class="hidden"><span id="gl1"></span><span id="gl2"></span></div>
<div id="gauge" class="hidden"><div id="gzone"></div><div id="gfill"></div><div id="gmark"></div></div>
<button id="act" class="hidden"></button>
<div id="fb" class="hidden"><div id="fbT"></div><div id="fbS"></div><div id="fbC"></div></div>
<div id="dragHint" class="hidden">ドラッグでお皿を回せます</div>

<div class="ov" id="title">
  <div class="card">
    <div class="step">SWEET POTATO KITCHEN</div>
    <h1>芋、焼きます</h1>
    <p>さつまいもを切って、蒸して、つぶして、焼き上げる。<br>7つの工程で最高のスイートポテトを作ろう！</p>
    <div style="background:#fff1e0;border:2px dashed #f6b26b;border-radius:14px;padding:8px 10px;font-size:13px;line-height:1.7;color:#7c2d12;margin:8px 0"><b>⏱ 制限時間のある工程があります</b><br>蒸す 6秒 ／ つぶす 5秒 ／ 混ぜる（かき混ぜ）4秒 ／ 卵黄 6秒<br><span style="font-size:11px">時間切れは容赦なく大失敗扱い。</span></div>
    <p style="font-size:12px;color:#b45309;margin-top:-2px"><b>難易度：鬼</b>　失敗しても最後まで作ります。<br>見た目は保証しません。</p>
    <button class="btn" id="startBtn">つくる</button>
  </div>
</div>
<div class="ov hidden" id="intro">
  <div class="card">
    <div class="step" id="inStep"></div>
    <h2 id="inTitle"></h2>
    <p id="inDesc"></p>
    <button class="btn" id="inGo">スタート</button>
  </div>
</div>
<div class="ov hidden" id="res" style="background:transparent;align-items:flex-end;padding-bottom:16px;pointer-events:none">
  <div class="card" id="resCard" style="pointer-events:auto;padding:18px 20px">
    <div class="step">COMPLETE!</div>
    <div class="stars" id="stars"></div>
    <div id="total"></div>
    <div id="rank"></div><div id="rcom"></div>
    <div id="rows"></div>
    <button class="btn" id="again">もう一度つくる</button>
    <button class="btn sub" id="hideRes">お皿を眺める</button>
  </div>
</div>
<div id="err" class="hidden">3D表示の読み込みに失敗しました。<br>通信状況を確認して再読み込みしてください。</div>

<script>
(function(){
if(!window.THREE){document.getElementById('err').classList.remove('hidden');return;}
const $=id=>document.getElementById(id);
const V3=THREE.Vector3;
const col=h=>new THREE.Color(h).convertSRGBToLinear();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------------- renderer / scene ----------------
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#f1dcc3');
scene.fog=new THREE.Fog(col('#f1dcc3'),16,34);
const camera=new THREE.PerspectiveCamera(38,1,0.1,120);
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<h?52:38;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

const hemi=new THREE.HemisphereLight(col('#fff3e2'),col('#a07656'),0.75);scene.add(hemi);
const key=new THREE.DirectionalLight(col('#fff0d8'),1.7);
key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-5.5,right:5.5,top:5.5,bottom:-5.5,near:1,far:30});
key.shadow.bias=-0.0004;key.shadow.normalBias=0.02;
scene.add(key);scene.add(key.target);
const fill=new THREE.DirectionalLight(col('#d6e6ff'),0.4);scene.add(fill);scene.add(fill.target);

// ---------------- textures ----------------
function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
const woodTex=canvasTex(1024,512,(g,w,h)=>{
  g.fillStyle='#c48f5c';g.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){
    const y=Math.random()*h,a=Math.random()*.18;
    g.strokeStyle=Math.random()<.5?`rgba(120,70,35,${a})`:`rgba(240,200,150,${a*.8})`;
    g.lineWidth=rnd(.6,3);g.beginPath();
    const ph=Math.random()*6,amp=rnd(1,6);
    for(let x=0;x<=w;x+=16){g.lineTo(x,y+Math.sin(x/rnd(80,200)+ph)*amp)}
    g.stroke();
  }
  for(let p=0;p<6;p++){g.fillStyle='rgba(80,40,15,.18)';g.fillRect(0,(p+1)*h/6-1,w,2)}
},[6,1]);
const boardTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#e9cfa4';g.fillRect(0,0,w,h);
  for(let i=0;i<140;i++){const y=Math.random()*h;g.strokeStyle=`rgba(160,110,60,${Math.random()*.15})`;g.lineWidth=rnd(.5,2);g.beginPath();const ph=Math.random()*6;for(let x=0;x<=w;x+=12)g.lineTo(x,y+Math.sin(x/90+ph)*3);g.stroke()}
  for(let i=0;i<40;i++){g.strokeStyle='rgba(120,80,40,.12)';g.lineWidth=.6;g.beginPath();const x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);g.lineTo(x+rnd(-60,60),y+rnd(-8,8));g.stroke()}
});
const tileTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#d9cbb8';g.fillRect(0,0,w,h);
  const n=4,s=w/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const l=rnd(-6,6);g.fillStyle=`rgb(${246+l},${240+l},${230+l})`;
    g.fillRect(i*s+3,j*s+3,s-6,s-6);
    const gr=g.createLinearGradient(i*s,j*s,i*s+s,j*s+s);gr.addColorStop(0,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(0,0,0,.04)');
    g.fillStyle=gr;g.fillRect(i*s+3,j*s+3,s-6,s-6);
  }
},[22,7]);
const skinTex=canvasTex(1024,256,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#8e2f57');gr.addColorStop(.5,'#a33a62');gr.addColorStop(1,'#7c2449');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){g.strokeStyle=`rgba(${Math.random()<.5?'60,10,30':'200,110,140'},${rnd(.05,.22)})`;g.lineWidth=rnd(.5,2.5);g.beginPath();const y=Math.random()*h,x=Math.random()*w,l=rnd(40,260);g.moveTo(x,y);g.bezierCurveTo(x+l/3,y+rnd(-6,6),x+l*2/3,y+rnd(-6,6),x+l,y+rnd(-4,4));g.stroke()}
  for(let i=0;i<70;i++){const x=Math.random()*w,y=Math.random()*h;g.fillStyle='rgba(70,20,35,.5)';g.beginPath();g.ellipse(x,y,rnd(1.5,4),rnd(1,2.5),0,0,7);g.fill();g.fillStyle='rgba(240,190,200,.25)';g.beginPath();g.arc(x+1,y-1,1,0,7);g.fill()}
});
const softTex=canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.4,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h)});
const clothTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#fdf6ec';g.fillRect(0,0,w,h);g.fillStyle='rgba(214,96,60,.35)';for(let i=0;i<8;i+=2){g.fillRect(i*32,0,32,h);g.fillRect(0,i*32,w,32)}g.fillStyle='rgba(214,96,60,.25)';for(let i=0;i<8;i+=2)for(let j=0;j<8;j+=2)g.fillRect(i*32,j*32,32,32)},[3,3]);

const M={
  wood:new THREE.MeshStandardMaterial({map:woodTex,roughness:.62}),
  board:new THREE.MeshStandardMaterial({map:boardTex,roughness:.7}),
  tile:new THREE.MeshStandardMaterial({map:tileTex,roughness:.35}),
  skin:new THREE.MeshStandardMaterial({map:skinTex,roughness:.55}),
  flesh:new THREE.MeshStandardMaterial({color:col('#f6cf5a'),roughness:.72}),
  steel:new THREE.MeshStandardMaterial({color:col('#d5d9de'),metalness:.55,roughness:.28}),
  darkSteel:new THREE.MeshStandardMaterial({color:col('#4b5057'),metalness:.5,roughness:.4}),
  black:new THREE.MeshStandardMaterial({color:col('#26221f'),roughness:.55}),
  ceramic:new THREE.MeshStandardMaterial({color:col('#fbf8f2'),roughness:.18,side:THREE.DoubleSide}),
  handle:new THREE.MeshStandardMaterial({color:col('#5b3a24'),roughness:.5}),
  paper:new THREE.MeshStandardMaterial({color:col('#f5ecd9'),roughness:.9}),
  cloth:new THREE.MeshStandardMaterial({map:clothTex,roughness:.95}),
};
function mesh(geo,mat,cast=true,recv=true){const m=new THREE.Mesh(geo,mat);m.castShadow=cast;m.receiveShadow=recv;return m}

// ---------------- room ----------------
const counter=mesh(new THREE.BoxGeometry(60,1,7),M.wood,false,true);counter.position.set(18,-.5,0);scene.add(counter);
const wall=mesh(new THREE.PlaneGeometry(60,14),M.tile,false,true);wall.position.set(18,6,-3.5);scene.add(wall);
const back=mesh(new THREE.BoxGeometry(60,.25,.4),M.wood,true,true);back.position.set(18,.12,-3.3);scene.add(back);

// stations
const ST={board:0,pot:7,bowl:14,tray:21,oven:28.5,plate:36};

// ---------------- audio ----------------
let AC=null,sizzleGain=null;
function audioInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}}
function tone(f,d=.12,type='sine',v=.15,slide=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}
function noise(d=.1,v=.2,fq=1200,q=1){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start()}
const sfx={
  chop(){noise(.09,.5,2600,.8);tone(180,.08,'triangle',.18,.5)},
  pop(){tone(520,.1,'sine',.15,1.8)},
  ding(){tone(880,.25,'sine',.12);setTimeout(()=>tone(1320,.35,'sine',.1),90)},
  squish(){noise(.12,.35,500,1.5);tone(140,.1,'sine',.12,.6)},
  fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.12),i*120))},
  bad(){tone(300,.25,'square',.06,.6)},
  tick(){tone(1200,.03,'square',.03)},
};
function sizzle(on){
  if(!AC)return;
  if(on&&!sizzleGain){const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(Math.random()<.02?1:.35);const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=2500;sizzleGain=AC.createGain();sizzleGain.gain.value=0;s.connect(f).connect(sizzleGain).connect(AC.destination);s.start();sizzleGain.src=s}
  if(!on&&sizzleGain){try{sizzleGain.src.stop()}catch(e){}sizzleGain=null}
}

// ---------------- tweens / particles ----------------
let tweens=[];
function tween(dur,fn,done,delay=0){const t={t:-delay,dur,fn,done};tweens.push(t);return t}
function updTweens(dt){for(const t of tweens.slice()){t.t+=dt;if(t.t<0)continue;const k=Math.min(1,t.t/t.dur);t.fn(k);if(k>=1){tweens.splice(tweens.indexOf(t),1);t.done&&t.done()}}}

const parts=[];
function puff(pos,opt={}){
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex,color:opt.color||0xffffff,transparent:true,opacity:0,depthWrite:false}));
  m.position.copy(pos);const s=opt.size||.4;m.scale.set(s,s,s);scene.add(m);
  parts.push({m,v:opt.vel||new V3(rnd(-.15,.15),rnd(.5,.9),rnd(-.15,.15)),life:0,max:opt.life||1.8,grow:opt.grow||1.2,op:opt.op||.55,s,g:opt.g||0});
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;const k=p.life/p.max;
    if(k>=1){scene.remove(p.m);p.m.material.dispose();parts.splice(i,1);continue}
    p.v.y-=p.g*dt;p.m.position.addScaledVector(p.v,dt);const s=p.s*(1+k*p.grow);p.m.scale.set(s,s,s);
    p.m.material.opacity=p.op*Math.sin(Math.PI*Math.min(1,k*1.4))*(1-k*.3);}
}

// ---------------- camera ----------------
const camPos=new V3(),camLook=new V3();let camFrom=null;
let orbit=null; // {center, r, h, a, speed}
function setCam(pos,look,dur=1.4,done){
  orbit=null;
  const p0=camPos.clone(),l0=camLook.clone();
  tween(dur,k=>{const e=ease(k);camPos.lerpVectors(p0,pos,e);camLook.lerpVectors(l0,look,e);camPos.y+=Math.sin(Math.PI*k)*.6*(p0.distanceTo(pos)>3?1:0)},done);
}
function focus(x){key.position.set(x+4,9,6);key.target.position.set(x,0,0);fill.position.set(x-6,4,-2);fill.target.position.set(x,0,0)}

// ---------------- sweet potato geometry ----------------
const PL=2.6,PR=.42,BOARD_TOP=.14;
function prad(t,a){const s=Math.pow(Math.max(0,Math.sin(Math.PI*t)),.55);return Math.max(.025,PR*s*(1-.14*(t-.5))*(1+.04*Math.sin(3*a+t*7)+.025*Math.sin(5*a-t*13)))}
function pbend(t){return .09*Math.sin(Math.PI*t)}
function potatoGeo(t0,t1){
  const nT=Math.max(3,Math.ceil((t1-t0)*48)),nA=40,pos=[],uv=[],idx=[];
  const P=(t,a)=>{const r=prad(t,a);return [(t-.5)*PL, r*Math.cos(a)+pbend(t), r*Math.sin(a)]};
  for(let i=0;i<=nT;i++){const t=t0+(t1-t0)*i/nT;for(let j=0;j<=nA;j++){const a=j/nA*Math.PI*2;pos.push(...P(t,a));uv.push(t,j/nA)}}
  for(let i=0;i<nT;i++)for(let j=0;j<nA;j++){const a=i*(nA+1)+j,b=a+nA+1;idx.push(a,a+1,b, b,a+1,b+1)}
  const skinCount=idx.length;
  const cap=(t,dir)=>{const c=pos.length/3;const x=(t-.5)*PL;pos.push(x,pbend(t),0);uv.push(.5,.5);
    for(let j=0;j<=nA;j++){const a=j/nA*Math.PI*2;pos.push(...P(t,a));uv.push(.5+.5*Math.cos(a),.5+.5*Math.sin(a))}
    for(let j=0;j<nA;j++){if(dir<0)idx.push(c,c+2+j,c+1+j);else idx.push(c,c+1+j,c+2+j)}};
  cap(t0,-1);cap(t1,1);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.addGroup(0,skinCount,0);g.addGroup(skinCount,idx.length-skinCount,1);
  g.computeVertexNormals();
  const cx=((t0+t1)/2-.5)*PL;g.translate(-cx,0,0);
  return {g,cx};
}
function makeSeg(t0,t1){const {g,cx}=potatoGeo(t0,t1);const m=mesh(g,[M.skin,M.flesh]);m.userData={t0,t1,cx,off:0};m.position.set(ST.board+cx,BOARD_TOP+PR,0);return m}

const BAKE_STOPS=[[0,[.97,.82,.42]],[.55,[.95,.66,.25]],[1,[.80,.45,.13]],[1.3,[.56,.27,.07]],[1.8,[.2,.1,.04]],[2.6,[.07,.05,.04]]];
function bakeCol(b){b=clamp(b,0,2.6);for(let i=1;i<BAKE_STOPS.length;i++){const [b1,c1]=BAKE_STOPS[i],[b0,c0]=BAKE_STOPS[i-1];if(b<=b1){const k=(b-b0)/(b1-b0);return c0.map((v,j)=>lerp(v,c1[j],k))}}return BAKE_STOPS[BAKE_STOPS.length-1][1]}
const toLin=v=>Math.pow(v,2.2);
const tri=p=>1-4*Math.abs(((p+.25)%1+1)%1-.5);
function sn(x,y,z,s){return (Math.sin(x*3.1+s)*Math.sin(y*4.3+z*2.7+s*1.3)+.6*Math.sin(z*5.3+x*1.7+s*2))/1.6}
// Q: damage carried between steps
let Q={};
function quality(){
  const st=scores[1]??100,ms=scores[2]??100,mx=scores[3]??100;
  return {
    lump:clamp((100-ms)/100*1.15+(Q.steamDir==='under'?(100-st)/100*.7:0),0,1.4),
    sag:clamp((Q.steamDir==='over'?(100-st)/100*.9:0)+(Q.creamOver?.45:0),0,1),
    mott:clamp((100-mx)/100*1.3,0,1),
    sugar:Q.sugarOver?1:clamp((100-mx)/250,0,.5),
  };
}
function boatGeo(q){
  const g=new THREE.SphereGeometry(1,56,36);const p=g.attributes.position;
  const lumps=[];for(let k=0;k<10;k++){const a=rnd(0,7),r=rnd(0,.95);lumps.push([Math.cos(a)*r,rnd(.25,1),Math.sin(a)*r,rnd(.5,1.1)])}
  const seed=rnd(0,10);
  for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    let L=0;for(const [lx,ly,lz,la] of lumps){const d2=(x-lx)**2+(y-ly)**2+(z-lz)**2;L+=la*Math.exp(-d2/.07)}
    const uy=y;
    if(y<0)y*=.22;x*=.3*(1+q.sag*.35);z*=.48*(1+q.sag*.15);y*=.27*(1-q.sag*.55);
    const top=Math.max(0,uy);
    y+=.014*Math.sin(z*30)*Math.pow(top,.6)*(1-Math.abs(z)/.6)*(1-Math.min(1,q.lump)*.8);
    y+=q.lump*.085*L*Math.pow(top,.5);x+=q.lump*.035*L*Math.sign(x)*top;
    p.setXYZ(i,x,y+.06,z)}
  g.computeVertexNormals();
  const n=p.count,c=new Float32Array(n*3);g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const top=new Float32Array(n),nrm=g.attributes.normal;for(let i=0;i<n;i++)top[i]=clamp(nrm.getY(i),0,1);
  const mott=new Float32Array(n),speck=new Uint8Array(n),char=new Float32Array(n);
  for(let i=0;i<n;i++){const x=p.getX(i)*9,y=p.getY(i)*9,z=p.getZ(i)*9;
    mott[i]=q.mott*sn(x,y,z,seed);speck[i]=Math.random()<q.sugar*.14?1:0;char[i]=clamp(.5+.8*sn(x*1.6,y*1.6,z*1.6,seed+3),0,1)}
  g.userData={glaze:new Float32Array(n),top,mott,speck,char};return g;
}
function recolor(m,bake){
  const g=m.geometry,c=g.attributes.color,{glaze,top,mott,speck,char}=g.userData;let gs=0;
  for(let i=0;i<c.count;i++){const gl=glaze[i];gs+=gl;
    let b=bake*(.5+.5*top[i])*(1+.28*gl);
    if(bake>.9)b*=1+char[i]*1.2*(bake-.9);

function fly(obj,to,dur,height,delay,rotTo,scaleTo,done){
  const from=obj.position.clone(),r0=obj.rotation.clone(),s0=obj.scale.x;
  tween(dur,k=>{const e=ease(k);obj.position.lerpVectors(from,to,e);obj.position.y+=Math.sin(Math.PI*e)*height;

    if(scaleTo!=null)obj.scale.setScalar(lerp(s0,scaleTo,e))},done,delay);
}

STAGES.push((()=>{

  function prepWeights(){for(const b of boats){const g=b.geometry,p=g.attributes.position,ix=g.index.array,w=new Float32Array(p.count);
    const A=new V3(),B=new V3(),C=new V3();

      const ar=B.clone().sub(A).cross(C.clone().sub(A)).length()/6;w[ix[k]]+=ar;w[ix[k+1]]+=ar;w[ix[k+2]]+=ar}
